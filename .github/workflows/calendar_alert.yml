name: US Economic Calendar News Alert

on:
  schedule:
    # Runs every 30 minutes to evaluate upcoming (2h prior) and releasing economic events
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-calendar-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Calendar Alert Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python us_economic_calendar_tracker.py --check

      - name: Commit and Push State File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ~/.us_calendar_tracker_state.json || true
          git commit -m "Update calendar state [skip ci]" || echo "No state changes to commit"
          git pull --rebase origin main || true
          git push origin main || true
